# Netlify deploy settings. Netlify detects Next.js and installs its Next.js
# runtime automatically; no plugin needs to be listed here.
[build]
  # Runs `prisma migrate deploy` (applies pending DB migrations) then `next build`.
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Silence Next.js telemetry in CI builds.
  NEXT_TELEMETRY_DISABLED = "1"
